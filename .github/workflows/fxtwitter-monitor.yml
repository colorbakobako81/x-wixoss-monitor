name: FxTwitter Monitor

on:
  schedule:
    - cron: "1 3 * * *"
    - cron: "5 3 * * *"
    - cron: "10 3 * * *"

    - cron: "31 3 * * *"
    - cron: "35 3 * * *"
    - cron: "40 3 * * *"

    - cron: "1 4 * * *"
    - cron: "5 4 * * *"
    - cron: "10 4 * * *"

    - cron: "31 8 * * *"
    - cron: "35 8 * * *"
    - cron: "40 8 * * *"

    - cron: "1 9 * * *"
    - cron: "5 9 * * *"
    - cron: "10 9 * * *"

    - cron: "31 9 * * *"
    - cron: "35 9 * * *"
    - cron: "40 9 * * *"

    - cron: "1 10 * * *"
    - cron: "5 10 * * *"
    - cron: "10 10 * * *"

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python fxtwitter_monitor.py

      - name: Save seen posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_posts.txt
          git diff --cached --quiet || git commit -m "Update seen posts"
          git push
