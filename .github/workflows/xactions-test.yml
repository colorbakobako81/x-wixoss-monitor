name: XActions Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存関係をインストール
        run: npm install

      - name: XActionsでXを取得
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: node xactions_test.js
