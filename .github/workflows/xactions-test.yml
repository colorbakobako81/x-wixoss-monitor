name: XActions Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install XActions
        run: npm install

      - name: Test XActions
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: node xactions_test.js
